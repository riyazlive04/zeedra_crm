name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret
      WHATSAPP_VERIFY_TOKEN: ci-verify-token
      APP_URL: http://localhost:3000
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma db push && npx tsx prisma/seed.ts
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 2; done
          BASE_URL=http://localhost:3000 npm run test:e2e
      - name: Browser UI check
        run: |
          npx playwright install --with-deps chromium
          npx tsx prisma/seed.ts
          BASE_URL=http://localhost:3000 SHOTS=screenshots npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sirah-zeedra-solar:ci .
