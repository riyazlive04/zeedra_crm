# Triggers time-based automations (visit reminders, follow-up nudges, quote expiry) every 10 minutes.
# Works on any Vercel plan. Set repository secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
name: Scheduler
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled automations
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set — skipping."; exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/run"
